name: Security Audit & CI

# Multi-layer security pipeline:
#   1. bun audit  → dependency CVEs (high/critical fail)
#   2. tsc       → type safety
#   3. gitleaks  → committed secrets
#   4. semgrep   → OWASP Top-10 / TS static analysis (SARIF → Code Scanning)
#   5. supabase validate → edge function directory shape

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  CI: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Auditoria de vulnerabilidades (fail em high/critical)
        run: |
          set +e
          bun audit --prod --json > audit.json
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            HIGH=$(jq '[.advisories[]? | select(.severity=="high" or .severity=="critical")] | length' audit.json)
            if [ "${HIGH:-0}" -gt 0 ]; then
              echo "::error::Encontradas ${HIGH} vulnerabilidades high/critical"
              jq '.advisories' audit.json
              exit 1
            fi
          fi
        continue-on-error: false

      - name: Verificação de tipos (tsc estrito)
        run: |
          bunx tsc -p tsconfig.app.json --noEmit
          bunx tsc -p tsconfig.node.json --noEmit

      - name: Supabase CLI
        uses: supabase/setup-cli@v1
        with: { version: "1.215.0" }

      - name: Validar diretório das Edge Functions
        run: |
          if [ -d "supabase/functions" ]; then
            supabase functions list || true
          else
            echo "supabase/functions não encontrado"
          fi

  gitleaks:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

  semgrep:
    name: SAST (semgrep OWASP + TS)
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep:latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: Rodar semgrep
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/typescript \
            --config p/react \
            --sarif --output semgrep.sarif \
            --error --severity ERROR \
            .
      - name: Publicar SARIF no Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  deploy-functions:
    name: Deploy Supabase Functions
    runs-on: ubuntu-latest
    needs: [security-scan, gitleaks, semgrep]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Supabase CLI
        uses: supabase/setup-cli@v1
        with: { version: "1.215.0" }
      - name: Deploy edge functions (managed pelo Lovable — noop)
        run: echo "Edge functions são deployadas automaticamente pelo Lovable."
