```yaml name=.github/workflows/security-audit.yml url=https://github.com/CMykhallas/tikvahpsycem/blob/774f03fd9cc2ba4900eda43f6a774738f68c3d0c/.github/workflows/security-audit.yml
name: Security Audit & CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Auditoria de Vulnerabilidades (npm audit)
        run: npm audit --audit-level=high

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: '1.200.0'

      - name: Verificar sintaxe das Edge Functions (Deno Check)
        run: supabase functions info
        continue-on-error: true

  deploy-functions:
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: '1.200.0'

      - name: Deploy de todas as Edge Functions
        run: supabase functions deploy --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: "Produção: Setar Secrets"
        run: |
          supabase secrets set --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" \
            STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
            MPESA_SHORTCODE="${{ secrets.MPESA_SHORTCODE }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
```
