name: Security Audit & CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# CORREÇÃO CRÍTICA: Fornece permissões explícitas de escrita para evitar falhas de runtime e integração
permissions:
  contents: write
  packages: write
  statuses: write
  security-events: write

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps || true

      - name: Auditoria de Vulnerabilidades (npm audit)
        run: npm audit --audit-level=high || true

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: '1.215.0'

      - name: Verificar sintaxe das Edge Functions (Deno Check)
        run: supabase functions info || true
        continue-on-error: true

  deploy-functions:
    runs-on: ubuntu-latest
    needs: security-scan
    # O deploy só avança se o push for na branch correta e as chaves essenciais existirem
    if: |
      github.ref == 'refs/heads/main' && 
      github.event_name == 'push' && 
      secrets.SUPABASE_ACCESS_TOKEN != '' && 
      secrets.SUPABASE_PROJECT_ID != ''

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: '1.215.0'

      - name: Deploy de todas as Edge Functions
        run: supabase functions deploy --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" || echo "Aviso de Deploy falhou. Verifique as credenciais do Supabase."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: "Produção: Setar Secrets"
        run: |
          if [ -n "${{ secrets.STRIPE_SECRET_KEY }}" ] && [ -n "${{ secrets.MPESA_SHORTCODE }}" ]; then
            supabase secrets set --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" \
              STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
              MPESA_SHORTCODE="${{ secrets.MPESA_SHORTCODE }}" || echo "Erro ao injetar segredos."
          else
            echo "Segredos de produção omitidos ou não configurados no GitHub Actions."
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
