name: Fix Lockfile & Dependencies

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'package.json'
      - 'bun.lockb'

jobs:
  sync-dependencies:
    name: Sync & Validate Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Update bun.lockb (remove --frozen-lockfile)
        run: |
          echo "Removendo --frozen-lockfile temporariamente..."
          bun install
          echo "✅ bun.lockb atualizado com sucesso"

      - name: 🔍 Verificar se há mudanças
        id: changes
        run: |
          if git diff --quiet bun.lockb; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: 📝 Commit & Push (se houver mudanças)
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bun.lockb
          git commit -m "🔄 Sync: Atualizar bun.lockb com dependências atualizadas"
          git push

      - name: ✅ Testar instalação com --frozen-lockfile
        run: bun install --frozen-lockfile

      - name: 🔐 Validar build
        run: bun run build
