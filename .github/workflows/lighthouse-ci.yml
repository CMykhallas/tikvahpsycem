name: Lighthouse CI — EcosystemDetail (perf + SEO)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true

jobs:
  lighthouse:
    name: Lighthouse on /ecosistema routes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (for Lighthouse CI)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build app
        run: bun run build

      - name: Preview server (background)
        run: |
          bunx vite preview --port 8080 --host 127.0.0.1 &
          echo $! > /tmp/preview.pid
          until curl -sSf http://127.0.0.1:8080 > /dev/null; do
            echo "waiting for preview…"; sleep 2;
          done

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse CI
        run: lhci autorun --config=.lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Stop preview
        if: always()
        run: kill $(cat /tmp/preview.pid) || true
