name: Lighthouse CI — EcosystemDetail (perf + SEO)

# Runs only on Pull Requests, and only when files that can affect
# the /ecosistema/:categoryId/:itemSlug route change. Enforces the
# performance budget defined in .lighthouserc.json.
on:
  pull_request:
    branches: [main]
    paths:
      - "src/pages/EcosystemDetail.tsx"
      - "src/lib/ecosystem-slug.ts"
      - "src/data/services-ecosystem.ts"
      - "src/components/SEOHead.tsx"
      - "src/lib/seo/jsonld.ts"
      - "src/index.css"
      - "tailwind.config.ts"
      - "vite.config.ts"
      - "package.json"
      - "bun.lockb"
      - ".lighthouserc.json"
      - ".github/workflows/lighthouse-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  CI: true


jobs:
  lighthouse:
    name: Lighthouse on /ecosistema routes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (for Lighthouse CI)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build app
        run: bun run build

      - name: Preview server (background)
        run: |
          bunx vite preview --port 8080 --host 127.0.0.1 &
          echo $! > /tmp/preview.pid
          until curl -sSf http://127.0.0.1:8080 > /dev/null; do
            echo "waiting for preview…"; sleep 2;
          done

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse CI
        run: lhci autorun --config=.lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Stop preview
        if: always()
        run: kill $(cat /tmp/preview.pid) || true
