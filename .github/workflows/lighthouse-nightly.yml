name: Lighthouse CI — Nightly regression detection

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      refresh_baseline:
        description: "Overwrite baseline with this run's results"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: read

env:
  CI: true
  # Regression thresholds (relative to baseline). Failing only when exceeded.
  LCP_DELTA_MS: 200
  INP_DELTA_MS: 50
  CLS_DELTA: 0.02
  TBT_DELTA_MS: 50

jobs:
  lighthouse-nightly:
    name: Lighthouse nightly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Preview server
        run: |
          bunx vite preview --port 8080 --host 127.0.0.1 &
          echo $! > /tmp/preview.pid
          until curl -sSf http://127.0.0.1:8080 > /dev/null; do sleep 2; done

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse
        run: lhci autorun --config=.lighthouserc.json --collect.numberOfRuns=3 || true

      - name: Download previous baseline
        id: baseline
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: lhci-baseline
          path: .lighthouseci-baseline

      - name: Compare against baseline
        id: compare
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const currentDir = '.lighthouseci';
          const baselineDir = '.lighthouseci-baseline';
          const th = {
            'largest-contentful-paint': Number(process.env.LCP_DELTA_MS),
            'interaction-to-next-paint': Number(process.env.INP_DELTA_MS),
            'cumulative-layout-shift': Number(process.env.CLS_DELTA),
            'total-blocking-time': Number(process.env.TBT_DELTA_MS),
          };
          if (!fs.existsSync(currentDir)) {
            console.log('No current LHCI output; skipping.');
            process.exit(0);
          }
          const load = (dir) =>
            fs.existsSync(dir)
              ? fs.readdirSync(dir).filter(f => f.startsWith('lhr-') && f.endsWith('.json'))
                  .map(f => JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8')))
              : [];
          const cur = load(currentDir);
          const base = load(baselineDir);
          if (base.length === 0) {
            console.log('No baseline yet — accepting current run as baseline.');
            process.exit(0);
          }
          const median = (arr) => { const s=[...arr].sort((a,b)=>a-b); return s[Math.floor(s.length/2)]; };
          const byUrl = (runs) => {
            const m = new Map();
            for (const r of runs) {
              const url = r.finalUrl || r.requestedUrl;
              const bucket = m.get(url) || {};
              for (const [id, thr] of Object.entries(th)) {
                const v = r.audits?.[id]?.numericValue;
                if (typeof v === 'number') { bucket[id] = bucket[id] || []; bucket[id].push(v); }
              }
              m.set(url, bucket);
            }
            const out = new Map();
            for (const [url, metrics] of m) {
              const med = {};
              for (const [k, arr] of Object.entries(metrics)) med[k] = median(arr);
              out.set(url, med);
            }
            return out;
          };
          const curMap = byUrl(cur);
          const baseMap = byUrl(base);
          const regressions = [];
          for (const [url, curMetrics] of curMap) {
            const baseMetrics = baseMap.get(url) || {};
            for (const [metric, delta] of Object.entries(th)) {
              const c = curMetrics[metric], b = baseMetrics[metric];
              if (c == null || b == null) continue;
              const diff = c - b;
              if (diff > delta) {
                regressions.push({ url, metric, current: c, baseline: b, diff, threshold: delta });
              }
            }
          }
          if (regressions.length > 0) {
            console.log('REGRESSIONS DETECTED:');
            for (const r of regressions) console.log(JSON.stringify(r));
            fs.writeFileSync('regressions.json', JSON.stringify(regressions, null, 2));
            process.exit(1);
          }
          console.log('No regressions vs baseline.');
          EOF
        env:
          LCP_DELTA_MS: ${{ env.LCP_DELTA_MS }}
          INP_DELTA_MS: ${{ env.INP_DELTA_MS }}
          CLS_DELTA: ${{ env.CLS_DELTA }}
          TBT_DELTA_MS: ${{ env.TBT_DELTA_MS }}

      - name: Update baseline (main / manual refresh)
        if: success() || github.event.inputs.refresh_baseline == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lhci-baseline
          path: .lighthouseci
          retention-days: 90
          overwrite: true

      - name: Open regression issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('regressions.json')
              ? '```json\n' + fs.readFileSync('regressions.json','utf8') + '\n```'
              : 'Regressions detected — see workflow logs.';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Lighthouse regression detected — ${new Date().toISOString().slice(0,10)}`,
              body,
              labels: ['performance', 'regression', 'automated'],
            });

      - name: Stop preview
        if: always()
        run: kill $(cat /tmp/preview.pid) || true
